<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart - Kalp Animasyonu</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div class="info">Seni Seviyorum kuzen <3</div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Çok dilli romantik kelimeler listesi
        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "Σ' αγαπώ", 
            "Ik hou van jou", "Jag älskar dig", "Kocham cię", "Anh yêu em"
        ];

        let particles = [];
        const scale = 18;

        // Kalp formülü (Matematiksel Koordinat)
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * scale, y: y * scale };
        }

        // Başlangıç parçacıklarını oluştur
        for (let i = 0; i < phrases.length; i++) {
            const t = Math.PI * 2 * (i / phrases.length);
            const p = getHeartPoint(t);
            particles.push({
                x: p.x,
                y: p.y,
                text: phrases[i],
                angle: t,
                size: 16
            });
        }

        let pulse = 0;

        function animate() {
            ctx.fillStyle = 'rgba(6, 2, 8, 0.2)'; // Arka planda yumuşak iz bırakma efekti
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            // Kalp atış (pulse) efekti
            pulse += 0.03;
            const currentScale = 1 + Math.sin(pulse) * 0.08;
            ctx.scale(currentScale, currentScale);

            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Kelimeleri kalp formasyonunda çiz
            particles.forEach((p, index) => {
                // Hafif hareket katan dalgalanma
                const t = p.angle + pulse * 0.2;
                const point = getHeartPoint(t);

                // Renk geçişleri (Kırmızıdan pembeye)
                const redValue = Math.floor(200 + 55 * Math.sin(pulse + index));
                ctx.fillStyle = `rgb(${redValue}, 20, 100)`;
                
                // Parıltı efekti
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff3366';

                ctx.fillText(p.text, point.x, point.y);
            });

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
